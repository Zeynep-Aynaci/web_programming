<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display kullanimi</title>
    <style>
        div {
            display: inline-block;
            background-color: aqua;
            width: 250px;
            height: 100px;
            margin: 10px;
        }

        a {
            width: 50px;
            display: block;
            text-decoration: none;
            background-color: bisque;
            padding: 5px 10px;
            margin-bottom: 5px;
        }

        a:hover {
            padding: 5px 10px;
            color: aliceblue;
            background-color: rgb(127, 227, 254);

        }

        span {
            display: block;
        }
    </style>
</head>

<body>

    <div id="kutu1">kutu 1</div>
    <div id="kutu2">kutu 2</div>

    <br><br>
    <a href="#">link 1</a>
    <a href="#">link 2</a>
    <a href="#">link 3</a>

    <br><br><br>
    <span>Lorem ipsum dolor sit amet consectetur.</span>
    <span>Lorem ipsum dolor sit amet consectetur.</span>
    <span>Lorem ipsum dolor sit amet consectetur.</span>

</body>

</html>
