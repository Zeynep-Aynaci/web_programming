<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Tasarim</title>
    <style>
        *{
            box-sizing: border-box;
        }
    h1 {
        font-size: 40px;
    }

    @media screen and (max-width:700px) {
        h1 {
            font-size: 30px;
        }
    }

    @media screen and (max-width:400px) {
        h1 {
            font-size: 15px;
        }
    }
    .kutu{
        width:25%;
        height:250px;
        background-color: rgb(152, 221, 244);
        float: left;
        border:2px solid black;
    }
    @media  screen and (max-width:700px) {
        .kutu{
            width: 50%;
        }
        
    }
    @media  screen and (max-width:400px) {
        .kutu{
            width: 100%;
        }
        
    }
</style>
</head>


<body>
    <h1>Lorem ipsum dolor sit amet consectetur.</h1>
    <br><br>
    <div class="kutu"></div>
    <div class="kutu"></div>
    <div class="kutu"></div>
    <div class="kutu"></div>
    <div class="kutu"></div>
</body>

</html>
