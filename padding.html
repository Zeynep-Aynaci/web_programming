<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding</title>
    <style>
        div {
            width: 200px;
            height: 200px;
        }

        #div1 {

            background-color: rgb(246, 146, 226);
            padding: 20px;

        }

        #div2 {

            background-color: rgb(216, 136, 39);
            padding: 50px 100px;
        }

        #div3 {
            background-color: aqua;
            padding-left: 30px;
        }

        span {
            background-color: rgb(231, 115, 115);
            display:block;
            width: 200px;
            padding:30px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <div id="div1">kutu 1</div>
    <div id="div2">kutu 2</div>
    <div id="div3">kutu 3</div>
    <br><br>
    <span>Lorem ipsum dolor sit.</span>
    <span>Lorem ipsum dolor sit amet.</span>
    <span>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quae, dolores. </span>


</body>

</html>
