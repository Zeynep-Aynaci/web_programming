<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin</title>
    <style>
        div{
            width: 200px;  height: 200px;
        }
        #div1 {

            background-color: rgb(246, 146, 226);
            float: left;
            margin: 100px 50px 50px 100px;

        }

        #div2 {

            background-color: rgb(216, 136, 39);
            float: left;
            margin-top: 300px;

        }

        #div3 {
            background-color: aqua;
            margin: auto;
            
        }

        span{
            background-color: brown;
            margin: 10px 20px 50px 100px;
            display: inline-block;

        }
    </style>

</head>

<body>

    <div id="div1">kutu 1</div>
    <div id="div2">kutu 2</div>
    <div id="div3">kutu 3</div>

    <span>1 </span>
    <span>2 </span>
    <span>3 </span>

</body>

</html>
