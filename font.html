<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bogle&family=Rubik+Gemstones&display=swap"
        rel="stylesheet">

    <style>       /*font family türlerini font google yazarak bulabilirsin library linkini eklemeyi unutma*/
        body {
            font-size: 10px;
        }

        h2 {
            font-size: 30px;
            font-family: "BBH Bogle", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        p {
            font-size: 2em;
            font-family: "Rubik Gemstones", system-ui;
            font-weight: 400;
            font-style: normal;
        }
    </style>
</head>

<body>
    <h2>Lorem ipsum dolor sit amet.</h2>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Error reprehenderit nesciunt voluptatem consequatur cum.
        Voluptas eveniet dolores rerum blanditiis dolore excepturi? Odit pariatur ipsam eum! In, voluptatibus
        perferendis. Fugiat, maxime.</p>
</body>

</html>
