<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste Biçimlendirme</title>
</head>
<style>
    ul{
        border: 2px solid rgb(98, 96, 96);
        padding: 10px;
        border-radius: 20px;
        background-color: rgb(246, 133, 133,0.45);
        list-style-type:none;
    }
    li{
        border: 3px solid rgb(237, 245, 247);
        border-radius:20px;
        padding: 10px;
        margin: 5px;
        background-color: rgb(65, 1, 1);
        color: rgb(246, 246, 246);
        font-weight: 300;
        font-size: 20px;
        border-left: 10px solid rgb(0, 0, 0);

    }
</style>

<body>
    <ul>
        <li>Web programing ileri düzey</li>
        <li>Embedded systems and Etic Hacker</li>
        <li>Using phyton and Siber Securit</li>
    </ul>
</body>
</html>
