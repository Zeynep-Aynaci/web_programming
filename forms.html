<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form>
        <p> 
             isim : <input type="text" name="isim"> 
        </p>

        <p>
             soyisim : <input type="text" name="soyisim">
        </p>

        <p> 
            e posta : <input type="email" name="eposta" >
        </p>

        <p>
             parola : <input type="password" name="parola" > 
        </p>

        <p>cinsiyet :  <br> 
        kadın <input type="radio" name="cinsiyet">
        erkek <input type="radio" name="cinsiyet">
         </p>
         <p>
            hobileriniz :<br> 
            kitap okumak<input type="checkbox" name="hobi">
            film izlemek<input type="checkbox" name="hobi">
            spor yapmak<input type="checkbox" name="hobi">
         </p>
         <p>
            Doğum yeriniz : 
            <select name="doğumyeri">
                <option>İstanbul</option>
                <option>İzmir</option>
                <option>Ankara</option>

            </select>
         </p>
         <p>
            bulunduğunuz yerler :<br>
            <select multiple name="bulunduğunuzyerler">
                <option>İstanbul</option>
                <option>Balıkesir</option>
                <option>Ankara</option>
                <option>İzmir</option>
            </select>

         </p>
    </form>
    
</body>
</html>
