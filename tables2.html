<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araç Satış Fiyatları</title>
</head>
<body>
     <table border="2" width="100%">

    <thead>
        <tr>
            <td>Araç Adı</td>
            <td>Fiyat</td>
            <td>Açıklama</td>
        </tr>
    </thead>

    <tbody>
    <tr>
        <td>X</td>
        <td>100.000</td>
        <td rowspan="2">Lorem ipsum dolor sit.</td>
    </tr>

    <tr>
        <td>Y</td>
        <td>200.000</td>
        
    </tr>

    <tr>
        <td>Z</td>
        
        <td colspan="2">Lorem, ipsum dolor.</td>
    </tr>
    </tbody>

    </table>
</body>
</html>
