<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Biçimlendirme</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        a {
            background-color: rgb(17, 71, 118);
            color: rgb(4, 3, 90);
            ;
            font-size: 20px;
            border-radius: 20px;
            padding: 10px 20px;
            margin: 10px;
            text-decoration: none;
            color: aliceblue;
        }

        a:hover {
            border: 2px solid rgb(17, 71, 118);
            background-color: rgb(255, 255, 255);
            color: rgb(17, 71, 118);

        }

        .button {
            padding: 10px 20px;
            margin: 10px;
            border: 2px solid darkorange;
            background-color: darkorange;
            color: white;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 100px;
        }

        .button:hover {
            border: 2px solid darkorange;
            background-color: rgb(252, 250, 249);
            color: darkorange;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <br><br>
    <a href="#">link 1</a>
    <a href="#">link 2</a>
    <a href="#">link 3</a>

    <br><br><br>

    <button class="button">
        <i class="fa-regular fa-house"></i> Anasayfa
    </button>

    <button class="button">
        <i class="fa-solid fa-address-card"></i> Hakkimizda
    </button>

    <button class="button">
        <i class="fa-solid fa-basket-shopping"></i> Kategoriler
    </button>
    
    <button class="button">
        <i class="fa-solid fa-phone"></i> İletisim
    </button>


</body>

</html>
