<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders</title>
    <style>
        .kutu {
            width: 400px;
            height: 150px;
            margin: 20px;
            padding: 20px;
            background-color: lightgray;
        }
        #kutu0{
            width: 150px;
            border: 5px solid palevioletred;
            border-radius: 50%;  //köşe kivrimini ifade eder
            padding: 30px;
        }

        #kutu1 {
            width: 150px;
            border: 5px solid rgb(42, 81, 224);
            border-radius: 10px;
        }

        #kutu2 {
            border-top: 4px solid orange;
        }

        #kutu3 {
            border-width: 5px;
            border-style: double;
            border-color: cadetblue;
        }

        #kutu4 {
            border-width: 4px;
            border-style: dashed;
            border-color: brown;
        }

        #kutu5 {
            border-width: 10px;
            border-style: groove;
            border-color: rgb(255, 235, 132);
        }

        #kutu6 {
            border-width: 5px;
            border-style: inset;
            border-color: aqua;
        }

        #kutu7 {
            border-top: 7px ridge red;
            border-left: 7px double lightslategray;
        }
    </style>
</head>

<body>
    <div class="kutu" id="kutu0">kutu 0</div>
    <div class="kutu" id="kutu1">kutu 1</div>
    <div class="kutu" id="kutu2">kutu 2</div>
    <div class="kutu" id="kutu3">kutu 3</div>
    <div class="kutu" id="kutu4">kutu 4</div>
    <div class="kutu" id="kutu5">kutu 5</div>
    <div class="kutu" id="kutu6">kutu 6</div>
    <div class="kutu" id="kutu7">kutu 7</div>

</body>

</html>
