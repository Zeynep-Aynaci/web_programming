<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .kutu {
            width: 25%;
            background-color: rgb(152, 221, 244);
            float: left;
            border: 2px solid black;
        }

        @media screen and (max-width:900px) {
            .kutu {
                width: 33.33%;
            }

        }

        @media screen and (max-width:600px) {
            .kutu {
                width: 50%;
            }

        }

        @media screen and (max-width:400px) {
            .kutu {
                width: 100%;
            }

        }
        img{
           max-width: 100%;
        }
    </style>
</head>

<body>
    <div class="kutu"> <img src="images/img1.jpg" alt=""> </div>
    <div class="kutu"><img src="images/img2.jpg" alt=""></div>
    <div class="kutu"><img src="images/img3.jpg" alt=""></div>
    <div class="kutu"><img src="images/img4.jpg" alt=""></div>
    <div class="kutu"><img src="images/img5.jpg" alt=""></div>
</body>

</html>
