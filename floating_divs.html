<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating divs kullanimi</title>
    <style>
        #container{
            background-color: rgb(3, 11, 18);
            border: 2px solid rgb(102, 229, 251);
            overflow: auto;
            height: 800px;
            
        }
        
        #div1{
            background-color: blanchedalmond;
            float: left;
            overflow: scroll;
            width: 200px;
            height: 500px;
        }
        #div2{
            background-color: rgb(160, 252, 221) ;
            float: left;
            width: 425px;
            height: 500px;
        }
        #div3{
            background-color: rgb(243, 161, 196);
            float: left;
            width: 425px;
            height: 500px;
        }
        #div4{
            background-color: burlywood;
            float: left;
            width: 425px;
            height: 500px;
        }
        div{
            overflow: auto;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="div1"></div>
        <div id="div2"></div>
        <div id="div3"></div>
        <div id="div4"></div>
    </div>

</body>

</html>
